<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Evolution Interactive</title>
    <style>
        :root {
            --bg-color: #050510;
            --text-color: #e0e0f0;
            --accent-color: #4a9eff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        .visual-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .info-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .star-container {
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .star {
            border-radius: 50%;
            transition: all 1s ease-in-out;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
            position: relative;
        }
        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(160, 50, 200, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            opacity: 1;
            transition: opacity 1s;
        }
        .controls {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #aaa;
        }
        .stage-title {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 10px;
        }
        .description {
            line-height: 1.6;
            margin-bottom: 20px;
        }
        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            filter: brightness(1.1);
        }
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        .hr-diagram {
            width: 100%;
            height: 200px;
            background: #111;
            margin-top: auto;
            border-radius: 8px;
            position: relative;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid #333;
        }
        .hr-label {
            position: absolute;
            font-size: 10px;
            color: #666;
        }
        .hr-point {
            width: 6px;
            height: 6px;
            background: var(--accent-color);
            border-radius: 50%;
            position: absolute;
            transition: all 0.5s;
            box-shadow: 0 0 5px currentColor;
        }
    </style>
</head>
<body>
    <h1>The Life of a Star</h1>
    
    <div class="container">
        <div class="controls">
            <div class="slider-group">
                <label>Initial Stellar Mass: <span id="mass-value">1.0</span> M☉</label>
                <input type="range" id="mass-slider" min="0.1" max="50" step="0.1" value="1.0">
                <div class="stats">
                    <span>Low Mass (0.1M☉)</span>
                    <span>High Mass (50M☉)</span>
                </div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="advance-btn">Advance Stage</button>
                <button id="reset-btn">Reset Star</button>
                <div id="age-display" style="margin-left: auto; color: #888;">Age: 0 million years</div>
            </div>
        </div>

        <div class="visual-panel">
            <div class="star-container">
                <div id="nebula" class="nebula"></div>
                <div id="star" class="star" style="width: 50px; height: 50px; background: #fff;"></div>
            </div>
        </div>

        <div class="info-panel">
            <div id="stage-name" class="stage-title">Protostar</div>
            <div id="stage-desc" class="description">A cloud of gas and dust is collapsing under gravity. Temperature and density are rising in the core.</div>
            
            <div class="hr-diagram">
                <div class="hr-label" style="bottom: 5px; right: 5px;">Temp (K)</div>
                <div class="hr-label" style="top: 5px; left: 5px;">Lum (L☉)</div>
                <div id="hr-point" class="hr-point" style="bottom: 20%; left: 80%;"></div>
            </div>
        </div>
    </div>

    <script>
        const massSlider = document.getElementById('mass-slider');
        const massValue = document.getElementById('mass-value');
        const advanceBtn = document.getElementById('advance-btn');
        const resetBtn = document.getElementById('reset-btn');
        const star = document.getElementById('star');
        const nebula = document.getElementById('nebula');
        const stageName = document.getElementById('stage-name');
        const stageDesc = document.getElementById('stage-desc');
        const ageDisplay = document.getElementById('age-display');
        const hrPoint = document.getElementById('hr-point');

        let currentStage = 0;
        let mass = 1.0;

        const getEvolution = (m) => {
            if (m < 0.8) {
                return [
                    { name: 'Protostar', desc: 'Gravitational collapse of molecular cloud.', size: 40, color: 'rgba(255,150,0,0.5)', hr: [20, 80], age: 0 },
                    { name: 'Main Sequence (Red Dwarf)', desc: 'Hydrogen fusion at a slow, steady rate. These stars live for trillions of years.', size: 30, color: '#ff4d00', hr: [10, 90], age: 100 },
                    { name: 'Red Dwarf', desc: 'Slowly burning through its fuel. Most of its life is spent here.', size: 28, color: '#ff4d00', hr: [8, 92], age: 10000 },
                    { name: 'White Dwarf', desc: 'After eons, it runs out of hydrogen and slowly cools down.', size: 10, color: '#aaccff', hr: [80, 20], age: 1000000 }
                ];
            } else if (m < 8) {
                return [
                    { name: 'Protostar', desc: 'Forming from a stellar nursery.', size: 60, color: 'rgba(255,200,100,0.6)', hr: [40, 80], age: 0 },
                    { name: 'Main Sequence (Sun-like)', desc: 'Fusing hydrogen into helium. Stable equilibrium between gravity and radiation pressure.', size: 50, color: '#fffb00', hr: [50, 50], age: 500 },
                    { name: 'Red Giant', desc: 'Hydrogen exhausted. The star expands as helium fusion begins in the core.', size: 150, color: '#ff4400', hr: [30, 10], age: 10000 },
                    { name: 'Planetary Nebula', desc: 'Outer layers are ejected into space, exposing the dense core.', size: 200, color: 'rgba(0,255,255,0.2)', hr: [60, 30], age: 10500, isNebula: true },
                    { name: 'White Dwarf', desc: 'The hot, dense core remains. No further fusion occurs.', size: 12, color: '#ffffff', hr: [85, 40], age: 11000 }
                ];
            } else {
                return [
                    { name: 'Protostar', desc: 'Rapid formation from massive gas clouds.', size: 100, color: 'rgba(100,200,255,0.7)', hr: [60, 60], age: 0 },
                    { name: 'Blue Supergiant', desc: 'Incredibly hot and luminous. Burning fuel at an unsustainable rate.', size: 80, color: '#00ccff', hr: [90, 10], age: 10 },
                    { name: 'Red Supergiant', desc: 'Fusing heavier elements (Carbon, Neon, Iron). The largest stars in the universe.', size: 220, color: '#ff2200', hr: [20, 5], age: 15 },
                    { name: 'Supernova', desc: 'Core collapse creates a massive explosion, spreading elements across the galaxy.', size: 300, color: '#ffffff', hr: [95, 5], age: 16, isExplosion: true },
                    { name: 'Neutron Star / Black Hole', desc: 'A tiny, extremely dense remnant remains. Intense gravity bends light.', size: 5, color: '#000', hr: [5, 95], age: 20 }
                ];
            }
        };

        const updateStar = () => {
            const stages = getEvolution(mass);
            if (currentStage >= stages.length) currentStage = stages.length - 1;
            
            const s = stages[currentStage];
            stageName.textContent = s.name;
            stageDesc.textContent = s.desc;
            ageDisplay.textContent = `Age: ${s.age} million years`;
            
            star.style.width = s.size + 'px';
            star.style.height = s.size + 'px';
            star.style.background = s.isExplosion ? 'radial-gradient(circle, #fff, #ff0, transparent)' : s.color;
            star.style.boxShadow = s.isExplosion ? '0 0 100px #fff' : `0 0 40px ${s.color}`;
            star.style.opacity = s.name === 'Black Hole' ? '0.2' : '1';
            
            nebula.style.opacity = s.isNebula ? '1' : '0';
            
            hrPoint.style.left = s.hr[0] + '%';
            hrPoint.style.bottom = s.hr[1] + '%';
            hrPoint.style.color = s.color;

            advanceBtn.disabled = currentStage === stages.length - 1;
        };

        massSlider.oninput = (e) => {
            mass = parseFloat(e.target.value);
            massValue.textContent = mass.toFixed(1);
            currentStage = 0;
            updateStar();
        };

        advanceBtn.onclick = () => {
            currentStage++;
            updateStar();
        };

        resetBtn.onclick = () => {
            currentStage = 0;
            updateStar();
        };

        updateStar();
    </script>
</body>
</html>
